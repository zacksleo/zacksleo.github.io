<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d1b3e"/>
    <stop offset="100%" stop-color="#1a3a6b"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#42a5f5"/>
  </marker>
  <marker id="arroww" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
  </marker>
</defs>
<rect width="800" height="420" fill="url(#bg)"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">代码结构演变：从 334 模型到 235 模型</text>
<!-- 334 模型：原生30%、C/C++代码30%、跨平台代码40% -->
<path d="M220,220 L220,100 A120,120 0 0,1 334.13,257.08 Z" fill="#fdd835" stroke="#0d1b3e" stroke-width="2"/>
<path d="M220,220 L334.13,257.08 A120,120 0 0,1 149.47,317.08 Z" fill="#ff9800" stroke="#0d1b3e" stroke-width="2"/>
<path d="M220,220 L149.47,317.08 A120,120 0 0,1 220,100 Z" fill="#42a5f5" stroke="#0d1b3e" stroke-width="2"/>
<text x="280.68" y="175.92" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">原生代码 30%</text>
<text x="243.18" y="291.33" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">C/C++代码 30%</text>
<text x="148.67" y="196.82" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">跨平台代码 40%</text>
<text x="220" y="85" text-anchor="middle" font-size="16" fill="#ffffff" font-family="sans-serif">As-Is: 334 模型</text>
<!-- 235 模型：C/C++代码20%、原生30%、跨平台代码50% -->
<path d="M580,220 L580,100 A120,120 0 0,1 694.13,182.92 Z" fill="#ff9800" stroke="#0d1b3e" stroke-width="2"/>
<path d="M580,220 L694.13,182.92 A120,120 0 0,1 580,340 Z" fill="#fdd835" stroke="#0d1b3e" stroke-width="2"/>
<path d="M580,220 L580,340 A120,120 0 1,1 580,100 Z" fill="#42a5f5" stroke="#0d1b3e" stroke-width="2"/>
<text x="624.08" y="159.32" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">C/C++代码 20%</text>
<text x="640.68" y="264.08" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">原生代码 30%</text>
<text x="505" y="220" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">跨平台代码 50%</text>
<text x="580" y="85" text-anchor="middle" font-size="16" fill="#ffffff" font-family="sans-serif">To-Be: 235 模型</text>
<line x1="380" y1="100" x2="380" y2="380" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5"/>
<text x="400" y="400" text-anchor="middle" font-size="13" fill="#90caf9" font-family="sans-serif">→ 跨平台代码占比持续上升，头部伙伴跨平台代码占比越来越高</text>
</svg>