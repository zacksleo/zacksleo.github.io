<text x="650" y="128" text-anchor="middle" font-size="13" fill="#ffffff" font-family="sans-serif"><tspan x="650" dy="0">OpenHarmony</tspan><tspan x="650" dy="13">平台需求 & 应用验证</tspan></text><line x1="230" y1="110" x2="290" y2="90" stroke="#42a5f5" stroke-width="2" marker-end="url(#arrow)"/><line x1="230" y1="140" x2="290" y2="170" stroke="#42a5f5" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="180" x2="390" y2="120" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/><line x1="490" y1="90" x2="560" y2="110" stroke="#42a5f5" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="150" x2="490" y2="170" stroke="#42a5f5" stroke-width="2" marker-end="url(#arrow)"/><text x="135" y="230" text-anchor="middle" font-size="13" fill="#90caf9" font-family="sans-serif">技术框架制定 →</text><text x="390" y="260" text-anchor="middle" font-size="13" fill="#90caf9" font-family="sans-serif">需求反馈 ↑↓</text><text x="650" y="230" text-anchor="middle" font-size="13" fill="#90caf9" font-family="sans-serif">← 落地验证</text><text x="375" y="320" text-anchor="middle" font-size="14" fill="#ffffff" font-family="sans-serif">确保 OpenHarmony 平台需求直接反馈到 Flutter 上游开发中</text>
