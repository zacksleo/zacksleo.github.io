<text x="205" y="421" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif"><tspan x="205" dy="0">Flutter Plugin X + Pigeon Component</tspan></text><rect x="410" y="400" width="360" height="35" rx="8" fill="#37474f" filter="url(#shadow)"/>
