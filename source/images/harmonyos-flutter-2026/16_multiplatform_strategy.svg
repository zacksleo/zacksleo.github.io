  <marker id="arroww" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
  </marker>
</defs>
<rect width="800" height="450" fill="url(#bg)"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Flutter 多端统一策略与业务解耦架构</text>
<rect x="30" y="55" width="340" height="120" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
<text x="200" y="119" text-anchor="middle" font-size="13" fill="#ffffff" font-family="sans-serif"><tspan x="200" dy="0"></tspan></text><text x="200" y="75" text-anchor="middle" font-size="14" fill="#fdd835" font-family="sans-serif">Platform Configurations</text><text x="200" y="100" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">• 统一 CI/CD (Flutter/Gradle/Xcode)</text><text x="200" y="120" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">• Dart 层代码（含插件）大部分复用</text><text x="200" y="140" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">• 平台条件对齐:</text><text x="200" y="160" text-anchor="middle" font-size="11" fill="#90caf9" font-family="sans-serif">  Platform.operatingSystem=='openHarmony'</text><rect x="410" y="55" width="370" height="120" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
<text x="595" y="119" text-anchor="middle" font-size="13" fill="#ffffff" font-family="sans-serif"><tspan x="595" dy="0"></tspan></text><text x="595" y="75" text-anchor="middle" font-size="14" fill="#fdd835" font-family="sans-serif">Pluggable Plugin 策略</text><text x="595" y="100" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">• 官方插件: image_picker: 0.8.6+2 → iOS/Android</text><text x="595" y="120" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">• OHOS 插件: image_picker_ohos: 0.8.6+2 → HarmonyOS</text><text x="595" y="145" text-anchor="middle" font-size="13" fill="#4caf50" font-family="sans-serif">版本号对齐 ↔  接口一致</text><rect x="30" y="210" width="740" height="100" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
<text x="400" y="264" text-anchor="middle" font-size="13" fill="#ffffff" font-family="sans-serif"><tspan x="400" dy="0"></tspan></text><text x="400" y="235" text-anchor="middle" font-size="14" fill="#fdd835" font-family="sans-serif">Pipeline 策略</text><text x="400" y="260" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">CI/CD 多渠道：Apple · Google Play Store · App Gallery</text><text x="400" y="280" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">PR Unit / 集成测试覆盖检查</text><text x="400" y="340" text-anchor="middle" font-size="15" fill="#fdd835" font-family="sans-serif">Flutter / Native 核心业务解耦</text><rect x="30" y="360" width="740" height="35" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
